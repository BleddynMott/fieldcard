# pages: publishes the built game to GitHub Pages (G-02, his "pages", 26 Nov).
# main publishes the game; a task branch (g0*) publishes a preview build, which adds a
# "play today again" button so a card can be judged more than once. One site: the last deploy wins.
# Actions pinned to SHAs. The github-pages environment must allow the branch (see tasks/G-02.md).
name: pages

on:
  push:
    branches: [main, 'g0*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: build
        run: npm run build
        env:
          VITE_PREVIEW: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
