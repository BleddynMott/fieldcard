# pages: publishes the built game to GitHub Pages (G-02, his "pages", 26 Nov).
# main publishes the game; a task branch (g0*) publishes a preview build, which adds a
# "play today again" button so a card can be judged more than once. One site: the last deploy wins.
# Actions pinned to SHAs. The github-pages environment allows main and g0* (tasks/G-02.md).
#
# Build and deploy are separate jobs, and the deploy tries once more after a wait: the artifact
# listing can lag its upload, so a deploy in the same job finds no artifact
# (actions/deploy-pages#451, open; failed here in run 45739931381, both attempts).
name: pages

on:
  push:
    branches: [main, 'g0*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: git identity for the hook tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: CI's lines (nothing is published from a commit that fails them)
        run: bash scripts/ci-checks.sh
      - name: build
        run: npm run build
        env:
          VITE_PREVIEW: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - name: wait before the one retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
